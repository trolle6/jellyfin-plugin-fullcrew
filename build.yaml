overview: "Full cast and crew, audio-type browsing, break bumpers, library stats, studio pages, and a playback character rail"
description: >
  Fetches complete TMDB cast and crew for movies and series, groups people by
  department, and shows them in a polished accordion on Jellyfin Web item detail
  pages. Includes a nostalgia Break Bumper action, a Library Stats page
  (genres, people, collections, resolution/HDR/codecs, and more), studio
  detail pages with TMDB company metadata plus library titles, and a playback
  side panel of billed characters (character + actor + still). Optional OpenAI
  scene identify remains available as an API.
